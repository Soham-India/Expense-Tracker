# =====================================================================
# Personal Finance & Expense Tracker — base configuration
# SAFE TO COMMIT: placeholders only, never real credentials.
#
# Resolution order (first match wins):
#   1. Shell/session environment variables
#   2. application-local.properties (git-ignored; create yours from
#      application.properties.example)
# Never put real passwords/secrets in this file.
# =====================================================================
spring.application.name=expence-tracker

# The "local" profile file is git-ignored; absence of the file is harmless.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ---- PostgreSQL (Flyway owns the schema; Hibernate only validates) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---- JWT ----
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
